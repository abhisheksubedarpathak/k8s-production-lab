apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: nginx-demo-set
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - env: dev
            namespace: nginx-dev
          - env: stage
            namespace: nginx-stage
          - env: prod
            namespace: nginx-prod

  template:
    metadata:
      name: nginx-{{env}}
    spec:
      project: default
      source:
        repoURL: https://github.com/abhisheksubedarpathak/k8s-production-lab.git
        targetRevision: main
        path: argocd/applicationsets/demo/environments/{{env}}
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
