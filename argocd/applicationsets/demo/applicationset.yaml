apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: nginx-demo-set
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - cluster: local
            url: https://kubernetes.default.svc
            namespace: applicationset-demo
  template:
    metadata:
      name: nginx-{{cluster}}
    spec:
      project: default
      source:
        repoURL: https://github.com/abhisheksubedarpathak/k8s-production-lab.git
        targetRevision: main
        path: argocd/applicationsets/demo/app
      destination:
        server: '{{url}}'
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
