
apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-web
  namespace: ecommerce
  labels:
    app: nginx-web

spec:
  replicas: 3

  selector:
    matchLabels:
      app: nginx-web

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  minReadySeconds: 5

  template:
    metadata:
      labels:
        app: nginx-web

    spec:
      containers:
        - name: nginx
          image: nginx:alpine

          envFrom:
            - configMapRef:
                name: ecommerce-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-db-secret
                  key: DB_PASSWORD

          ports:
            - containerPort: 80
              name: http
              protocol: TCP

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
