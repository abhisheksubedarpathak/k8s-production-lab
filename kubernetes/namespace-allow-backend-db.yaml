apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: namespace-allow-backend-db
  namespace: network-policy-demo
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: database
      ports:
        - protocol: TCP
          port: 5432
